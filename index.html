<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#74128c">
<title>29 por siempre ♡</title>
<style>
:root{--purple:#74128c;--pink:#d63db6;--gold:#f5d58b;--ink:#42104d;--pale:#fff4ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 14px 38px;background:radial-gradient(circle at 50% 0,#bd37bd 0,#74128c 48%,#39074e 100%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);text-align:center}
header{color:#ffe5a3;margin:10px auto 22px}
h1{font-family:Georgia,serif;font-size:clamp(2.2rem,8vw,3.3rem);margin:0 0 4px;text-shadow:0 3px 15px #3d064d66}
header p{color:#fff0ff;font-size:1.05rem;margin:0}
main{max-width:680px;margin:auto;background:linear-gradient(145deg,#fffaff,#f8e4f7);border:5px solid var(--gold);border-radius:30px;padding:clamp(16px,4vw,28px);box-shadow:0 18px 55px #25002e66}
.wheel-wrap{position:relative;width:min(82vw,540px);aspect-ratio:1;margin:0 auto 28px;filter:drop-shadow(0 9px 9px #42104d44)}
canvas{width:100%;height:100%;display:block;border-radius:50%}
.pointer{position:absolute;left:-3%;top:50%;transform:translateY(-50%);width:0;height:0;border-top:25px solid transparent;border-bottom:25px solid transparent;border-left:0;border-right:42px solid #5b126e;z-index:2;filter:drop-shadow(2px 3px 2px #0003)}
.spin{border:0;border-radius:999px;padding:17px 28px;width:min(100%,520px);background:linear-gradient(100deg,#8312a5,#d43bb6);color:white;font-size:clamp(1.05rem,4vw,1.35rem);font-weight:800;letter-spacing:.02em;box-shadow:0 9px 20px #84129c44;cursor:pointer}
.spin:disabled{opacity:.65;cursor:not-allowed}
.result{margin:22px 0 24px;padding:22px 15px;border:2px solid #dfb8e0;border-radius:25px;background:#f4e1f4}
.kicker{font-size:.9rem;font-weight:800;letter-spacing:.16em;color:#865887;margin-bottom:7px}
.result h2{font-size:clamp(1.45rem,5vw,2rem);margin:0;color:#641276}
.result p{margin:8px 0 0;color:#865887;font-size:1rem}
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;text-align:left;margin:20px 0 4px;padding:0;list-style:none}
.gifts li{font-size:1rem;line-height:1.35;display:flex;gap:9px;align-items:flex-start}
.gifts b{color:#a33aa8;min-width:22px}
.final{display:none;margin:24px auto 0;padding:16px;border-radius:24px;background:linear-gradient(135deg,#7b168e,#c633ad);color:white;box-shadow:0 12px 28px #69147b55}
.final.show{display:block;animation:pop .7s ease both}
.final h2{color:#ffe5a3;font-size:clamp(1.8rem,7vw,2.7rem);margin:5px 0 14px}
.final img{display:block;width:100%;max-height:780px;object-fit:contain;border:4px solid var(--gold);border-radius:17px;background:#fff}
.final p{font-size:1.2rem;font-weight:700;margin:14px 0 3px}
.note{color:#946d96;font-size:.82rem;margin:20px 0 0}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@media(max-width:460px){.gifts{grid-template-columns:1fr}.wheel-wrap{width:min(86vw,430px)}}
</style>
</head>

  </section>
  <p class="note">Una sola oportunidad de girar. El resultado queda guardado en este dispositivo.</p>
</main>
<script>
const gifts = [
  {n:1, emoji:"👖", name:"Un jean", color:"#d71945"},
  {n:2, emoji:"💛", name:"Aretes de oro", color:"#ed7900"},
  {n:3, emoji:"👟", name:"Tenis deportivos", color:"#078b4b"},
  {n:4, emoji:"💜", name:"Leggings y top deportivo", color:"#b235b4"},
  {n:5, emoji:"👠", name:"Sandalias planas", color:"#263fc1"},
  {n:6, emoji:"🥾", name:"Botines de cuero negro, planos", color:"#079b91"},
  {n:7, emoji:"✨", name:"Peeling facial", color:"#f05b35"},
  {n:8, emoji:"🎁", name:"¡Regalo sorpresa!", color:"#087eb8"}
];
const canvas=document.getElementById("wheel"), ctx=canvas.getContext("2d");
const spinBtn=document.getElementById("spin");
const slice=Math.PI*2/gifts.length, cx=450, cy=450, radius=420;
let rotation=0, spinning=false;
function draw(){
  ctx.clearRect(0,0,900,900);
  gifts.forEach((g,i)=>{
    const start=-Math.PI/2+i*slice, end=start+slice;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,start,end);ctx.closePath();
    ctx.fillStyle=g.color;ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#fff7ff";ctx.stroke();
    const mid=start+slice/2;
    ctx.save();ctx.translate(cx+Math.cos(mid)*270,cy+Math.sin(mid)*270);ctx.rotate(mid+Math.PI/2);
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="bold 65px system-ui";ctx.fillText(String(g.n),0,-12);
    ctx.font="54px system-ui";ctx.fillText(g.emoji,0,65);ctx.restore();
  });
  ctx.beginPath();ctx.arc(cx,cy,72,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=10;ctx.strokeStyle="#dfb8e0";ctx.stroke();
  ctx.fillStyle="#74128c";ctx.font="bold 46px Georgia";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("29",cx,cy+2);
}
function renderList(){
  document.getElementById("giftList").innerHTML=gifts.map(g=>`<li><b>${g.n}.</b><span>${g.emoji} ${g.name}</span></li>`).join("");
}
function showResult(index, savedRotation){
  rotation=savedRotation;
  canvas.style.transform=`rotate(${rotation}rad)`;
  const g=gifts[index];
  document.getElementById("resultLabel").textContent="¡TU REGALO SELECCIONADO!";
  document.getElementById("resultName").textContent=`${g.emoji} ${g.name}`;
  document.getElementById("resultSub").textContent="¿Será este el regalo elegido? 💜";
  document.getElementById("final").classList.add("show");
  spinBtn.disabled=true;
  spinBtn.textContent="💜 GIRO REALIZADO";
}
function restore(){
  try{
    const saved=JSON.parse(localStorage.getItem("ruleta29_resultado"));
    if(saved && Number.isInteger(saved.index) && saved.index>=0 && saved.index<gifts.length){
      showResult(saved.index,saved.rotation);
    }
  }catch(e){}
}
spinBtn.addEventListener("click",()=>{
  if(spinning || localStorage.getItem("ruleta29_resultado"))return;
  spinning=true;spinBtn.disabled=true;
  const index=Math.floor(Math.random()*gifts.length);
  const center=-Math.PI/2+(index+.5)*slice;
  const target=((Math.PI-center)%(Math.PI*2)+(Math.PI*2))%(Math.PI*2);
  const extra=6+Math.floor(Math.random()*3);
  const finalRotation=extra*Math.PI*2+target;
  const start=performance.now(), duration=5200, initial=rotation;
  function animate(now){
    const t=Math.min(1,(now-start)/duration), ease=1-Math.pow(1-t,5);
    rotation=initial+(finalRotation-initial)*ease;
    canvas.style.transform=`rotate(${rotation}rad)`;
    if(t<1){requestAnimationFrame(animate);return;}
    rotation=finalRotation;
    try{localStorage.setItem("ruleta29_resultado",JSON.stringify({index,rotation}));}catch(e){}
    spinning=false;
    showResult(index,rotation);
  }
  requestAnimationFrame(animate);
});
draw();renderList();restore();
</script>
